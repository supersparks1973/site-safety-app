<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="60 60 904 904">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F4E79"/>
      <stop offset="1" stop-color="#0B2340"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6ECF2"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC94A"/>
      <stop offset="1" stop-color="#F29F05"/>
    </linearGradient>
  </defs>

  <!-- macOS-style rounded tile -->
  <rect x="0" y="0" width="1100" height="1100" fill="url(#bg)"/>
  

  <!-- shadow of sheet -->
  <rect x="262" y="232" width="470" height="600" rx="34" fill="#000" opacity="0.28"/>
  <!-- sheet -->
  <rect x="250" y="215" width="470" height="600" rx="34" fill="url(#paper)"/>

  <!-- header bar -->
  <rect x="250" y="215" width="470" height="120" rx="34" fill="#2E75B6"/>
  <rect x="250" y="290" width="470" height="45" fill="#2E75B6"/>
  <text x="485" y="300" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="84" fill="#FFFFFF" letter-spacing="6">BOQ</text>

  <!-- column divider -->
  <line x1="560" y1="360" x2="560" y2="780" stroke="#C3CEDA" stroke-width="6"/>

  <!-- rows: description bars + amount bars -->
  <g fill="#9FB3C8">
    <rect x="290" y="380" width="230" height="26" rx="13"/>
    <rect x="590" y="380" width="90" height="26" rx="13"/>
    <rect x="290" y="450" width="190" height="26" rx="13"/>
    <rect x="590" y="450" width="90" height="26" rx="13"/>
    <rect x="290" y="520" width="220" height="26" rx="13"/>
    <rect x="590" y="520" width="90" height="26" rx="13"/>
    <rect x="290" y="590" width="170" height="26" rx="13"/>
    <rect x="590" y="590" width="90" height="26" rx="13"/>
  </g>
  <g stroke="#DCE3EA" stroke-width="4">
    <line x1="280" y1="428" x2="690" y2="428"/>
    <line x1="280" y1="498" x2="690" y2="498"/>
    <line x1="280" y1="568" x2="690" y2="568"/>
    <line x1="280" y1="638" x2="690" y2="638"/>
  </g>
  <!-- total line -->
  <line x1="280" y1="680" x2="690" y2="680" stroke="#1F4E79" stroke-width="8"/>
  <rect x="290" y="710" width="120" height="30" rx="15" fill="#1F4E79"/>
  <rect x="570" y="706" width="110" height="38" rx="19" fill="#1F4E79"/>

  <!-- £ badge -->
  <circle cx="722" cy="732" r="138" fill="#000" opacity="0.25"/>
  <circle cx="712" cy="718" r="138" fill="url(#badge)" stroke="#FFFFFF" stroke-width="14"/>
  <text x="712" y="776" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="170" fill="#0B2340">£</text>
</svg>
